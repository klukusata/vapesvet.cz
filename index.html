<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapeshop Vapesvět</title>

    <!-- Moderní font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ====== ZÁKLADNÍ NASTAVENÍ ====== */
        body {
            font-family: "Poppins", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #050607;
            color: #f5f5f5;
            line-height: 1.6;
        }

        a {
            color: #00ff88;
        }

        /* ====== STREET / URBAN HEADER ====== */
        .urban-header {
            background: radial-gradient(circle at top left, #00ff88 0, #0f0f0f 40%, #050505 100%);
            padding: 70px 20px 60px 20px;
            text-align: center;
            border-bottom: 4px solid #00ff66;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        .urban-title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 16px rgba(0,0,0,0.8), 0 0 18px rgba(0,255,120,0.4);
        }

        .urban-underline {
            width: 190px;
            height: 5px;
            background: #00ff66;
            margin: 22px auto 0 auto;
            border-radius: 3px;
            box-shadow: 0 0 16px #00ff66;
        }

        .open-banner {
            background: #101c12;
            color: #c8ffd9;
            text-align: center;
            padding: 10px;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid #00ff66;
            display: none;
        }

        /* ====== OBSAHOVÉ BOXY ====== */
        .container {
            max-width: 900px;
            margin: 35px auto;
            background: #101214;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            border: 1px solid #1f262b;
        }

        h2 {
            color: #00ff88;
            border-left: 5px solid #00ff88;
            padding-left: 12px;
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
        }

        h3 {
            margin-top: 26px;
            color: #f5f5f5;
            font-size: 20px;
            font-weight: 600;
        }

        h4 {
            margin-top: 18px;
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 500;
        }

        ul {
            margin-top: 8px;
            padding-left: 20px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #00ff66, transparent);
            margin: 35px 0;
            border-radius: 2px;
            opacity: 0.7;
        }

        /* ====== FOTKY ====== */
        .photo,
        .photo-small {
            width: 100%;
            border-radius: 14px;
            margin: 18px 0;
            box-shadow: 0 4px 18px rgba(0,0,0,0.8);
        }

        .photo-small {
            max-height: 260px;
            object-fit: cover;
        }

        /* ====== INFO BOXY ====== */
        .notice {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid #ffcc33;
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .highlight-box {
            background: rgba(0,255,136,0.06);
            border-left: 4px solid #00ff88;
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
        }

        .warning {
            color: #ff5555;
            font-weight: 700;
            margin-top: 18px;
        }

        /* ====== TLAČÍTKA (NEON / GLASS) ====== */
        .btn-box {
            margin-top: 26px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            background: linear-gradient(135deg, rgba(0,255,136,0.18), rgba(0,0,0,0.9));
            border: 1px solid #00ff88;
            color: #f5f5f5;
            padding: 14px;
            text-align: center;
            font-size: 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.25s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.8);
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(0,255,136,0.35), rgba(0,0,0,1));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
        }

        /* ====== SPODNÍ LIŠTA ====== */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #050707;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 999;
            border-top: 1px solid #00ff66;
            box-shadow
